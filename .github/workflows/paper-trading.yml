name: Forward paper trading
on:
  workflow_dispatch:
  schedule:
    # 13:05 Beijing; delayed jobs outside 13:00-14:00 record waiting, never backfill.
    - cron: "5 5 * * 1-5"
concurrency:
  group: paper-trading-ledger
  cancel-in-progress: false
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      SNAPSHOT_REMOTE_ENABLED: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Simulate both accounts
        run: python paper_trading.py
      - name: Persist public simulated ledger
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/research/paper_trading.json
          git diff --cached --quiet && exit 0
          git commit -m "data: update paper trading ledger"
          git pull --rebase origin main
          git push origin HEAD:main
