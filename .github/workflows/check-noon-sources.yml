name: Check noon sources without email
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python check_noon_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noon-sources-${{ github.run_id }}
          path: output/verification/noon-sources.json
