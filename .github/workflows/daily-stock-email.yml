name: Daily holding advice and weekly trend plan email

on:
  workflow_dispatch:
    inputs:
      force_send:
        description: Send even if today's marker exists
        required: false
        type: boolean
        default: false
      preview_only:
        description: Validate generated email without sending
        required: false
        type: boolean
        default: false
      require_board_data:
        description: Stop this run if board data is unavailable
        required: false
        type: boolean
        default: true
  schedule:
    # GitHub Actions uses UTC: 04:00 UTC = 12:00 Asia/Shanghai on weekdays.
    - cron: "0 4 * * 1-5"

concurrency:
  group: daily-stock-email
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    env:
      MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST || 'smtp.qq.com' }}
      MAIL_SMTP_PORT: ${{ vars.MAIL_SMTP_PORT || '465' }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      GH_TOKEN: ${{ github.token }}
      EMAIL_UNIVERSE_LIMIT: ${{ vars.EMAIL_UNIVERSE_LIMIT || '500' }}
      PUSH_FUNDAMENTAL_MIN: ${{ vars.PUSH_FUNDAMENTAL_MIN || '60' }}
      PUSH_TECHNICAL_MIN: ${{ vars.PUSH_TECHNICAL_MIN || '60' }}
      PUSH_DISPLAY_LIMIT: ${{ vars.PUSH_DISPLAY_LIMIT || '20' }}
      ACCOUNT_STATE_JSON: ${{ secrets.ACCOUNT_STATE_JSON }}
      SITE_URL: https://a-share-trading.onrender.com
      PYTHONUNBUFFERED: "1"
      EMAIL_PREVIEW_ONLY: ${{ inputs.preview_only || 'false' }}
      REQUIRE_BOARD_DATA: ${{ (github.event_name == 'schedule' || inputs.require_board_data) && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v4

      - name: Determine Beijing date
        id: beijing_date
        shell: bash
        run: echo "date=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore daily send marker
        id: sent_cache
        uses: actions/cache/restore@v4
        with:
          path: .email-sent-marker
          key: daily-stock-email-${{ steps.beijing_date.outputs.date }}

      - uses: actions/setup-python@v5
        if: inputs.force_send == true || inputs.preview_only == true || steps.sent_cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        if: inputs.force_send == true || inputs.preview_only == true || steps.sent_cache.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt
      - name: Restore latest technical factor snapshot
        if: inputs.force_send == true || inputs.preview_only == true || steps.sent_cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: output/quant
          key: quant-report-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            quant-report-${{ runner.os }}-
      - name: Download latest technical artifact when cache is empty
        if: (inputs.force_send == true || inputs.preview_only == true || steps.sent_cache.outputs.cache-hit != 'true') && hashFiles('output/quant/quant_summary.json') == ''
        shell: bash
        run: |
          run_id=$(gh run list --workflow quant-factor-research.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$run_id"
          gh run download "$run_id" --pattern 'quant-factor-report-*' --dir output/quant
      - name: Generate and send email
        if: inputs.force_send == true || inputs.preview_only == true || steps.sent_cache.outputs.cache-hit != 'true'
        run: python email_digest.py
      - name: Publish latest website snapshot
        if: inputs.preview_only != true && always() && hashFiles('output/research/fundamental_latest.json') != ''
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/research/fundamental_latest.json
          test ! -f output/research/selection_snapshot.json || git add -f output/research/selection_snapshot.json
          test ! -f output/research/weekly_plan.json || git add -f output/research/weekly_plan.json
          git diff --cached --quiet && exit 0
          git commit -m "data: update fundamental snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Record successful send
        if: inputs.preview_only != true && success() && steps.sent_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .email-sent-marker
          echo "${{ steps.beijing_date.outputs.date }}" > .email-sent-marker/date
      - name: Save daily send marker
        if: inputs.preview_only != true && success() && steps.sent_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .email-sent-marker
          key: daily-stock-email-${{ steps.beijing_date.outputs.date }}
      - name: Save email data quality evidence
        if: always() && hashFiles('output/research/email_quality.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: email-data-quality-${{ github.run_id }}
          path: output/research/email_quality.json
