name: Daily stock selection email

on:
  schedule:
    # GitHub Actions uses UTC. Try at 12:25, 13:25, 14:25 and 15:25
    # Asia/Shanghai. Later attempts are automatic fallbacks.
    - cron: "25 4-7 * * 1-5"
    # Temporary schedule-only validation window: 15:35-15:55 Asia/Shanghai.
    - cron: "35,40,45,50,55 7 * * 1-5"
  workflow_dispatch:

concurrency:
  group: daily-stock-email
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST || 'smtp.qq.com' }}
      MAIL_SMTP_PORT: ${{ vars.MAIL_SMTP_PORT || '465' }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      EMAIL_UNIVERSE_LIMIT: ${{ vars.EMAIL_UNIVERSE_LIMIT || '500' }}
      EMAIL_STOCK_COUNT: ${{ vars.EMAIL_STOCK_COUNT || '10' }}
      SITE_URL: https://a-share-trading.onrender.com
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Determine Beijing date
        id: beijing_date
        shell: bash
        run: echo "date=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore daily send marker
        id: sent_cache
        uses: actions/cache/restore@v4
        with:
          path: .email-sent-marker
          key: daily-stock-email-${{ steps.beijing_date.outputs.date }}

      - uses: actions/setup-python@v5
        if: github.event_name != 'schedule' || steps.sent_cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        if: github.event_name != 'schedule' || steps.sent_cache.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt
      - name: Generate and send email
        if: github.event_name != 'schedule' || steps.sent_cache.outputs.cache-hit != 'true'
        run: python email_digest.py
      - name: Record successful send
        if: success() && steps.sent_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .email-sent-marker
          echo "${{ steps.beijing_date.outputs.date }}" > .email-sent-marker/date
      - name: Save daily send marker
        if: success() && steps.sent_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .email-sent-marker
          key: daily-stock-email-${{ steps.beijing_date.outputs.date }}
